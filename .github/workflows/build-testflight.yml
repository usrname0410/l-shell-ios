# L Shell を GitHub Actions でビルドして TestFlight（内部テスト）へ上げるワークフロー
# 置き場所: 自分のフォークの .github/workflows/build-testflight.yml
#
# 事前に必要な設定:
#   リポジトリ変数 (Settings > Secrets and variables > Actions > Variables)
#     BUNDLE_ID     例: com.koseki0410.claudeterminal
#     APPLE_TEAM_ID 例: ABCDE12345
#   Secrets (同画面の Secrets)
#     ASC_API_KEY_ID        App Store Connect API キーの Key ID
#     ASC_API_ISSUER_ID     同 Issuer ID
#     ASC_API_KEY_P8        .p8 ファイルの中身（PEM テキスト、そのまま複数行で登録）
#     CERT_P12_B64          Apple Distribution 証明書 (.p12) を base64 化したもの
#     CERT_PASSWORD         .p12 のパスワード
#     PROFILE_B64           App Store 用プロビジョニングプロファイルを base64 化したもの
#
# 注意: Python の .so 再署名 (scripts/sign-dynload.sh) と App Store 検証の相性は未検証。
# 初回はまずこのワークフローでアーカイブと検証まで回し、結果を見るのが目的。

name: Build and upload to TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "No Xcode 26 found, using the default Xcode"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: JS dependencies and vendored Claude Code
        run: |
          cd node-runtime
          npm ci
          npm pack @anthropic-ai/claude-code@2.1.112
          mkdir -p vendor/claude-code
          tar -xzf anthropic-ai-claude-code-2.1.112.tgz -C vendor/claude-code --strip-components=1
          # The npm package ships desktop (macOS) native binaries under
          # vendor/ (ripgrep, audio-capture, sshcrypto). They cannot run on
          # iOS and App Store validation rejects them, so drop the binary
          # files (JS wrappers stay).
          find vendor/claude-code/vendor -type f \( -name 'rg' -o -name 'rg.exe' -o -name '*.node' \) -delete 2>/dev/null || true

      - name: Download frameworks
        run: |
          mkdir -p ios/Frameworks
          curl -L -o /tmp/nodemobile.zip https://github.com/1Conan/nodejs-mobile/releases/download/v18.19.1-ios/NodeMobile.xcframework.zip
          unzip -q /tmp/nodemobile.zip -d ios/Frameworks/
          curl -L -o /tmp/py.tar.gz https://github.com/beeware/Python-Apple-support/releases/download/3.13-b18/Python-3.13-iOS-support.b18.tar.gz
          mkdir -p /tmp/py && tar -xzf /tmp/py.tar.gz -C /tmp/py
          mv /tmp/py/Python.xcframework ios/Frameworks/

      - name: Bundle runtime and generate project
        run: |
          cd ios
          bash scripts/bundle-runtime.sh
          bash scripts/bundle-python.sh
          xcodegen generate

      - name: Fetch provisioning profile from App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          cat > /tmp/fetch-profile.mjs <<'EOF'
          import { createSign } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const b64url = (s) => Buffer.from(s).toString('base64url');
          const header = b64url(JSON.stringify({ alg: 'ES256', kid: process.env.ASC_API_KEY_ID, typ: 'JWT' }));
          const now = Math.floor(Date.now() / 1000);
          const payload = b64url(JSON.stringify({ iss: process.env.ASC_API_ISSUER_ID, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }));
          const signer = createSign('SHA256');
          signer.update(header + '.' + payload);
          signer.end();
          const signature = signer.sign({ key: process.env.ASC_API_KEY_P8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          const jwt = header + '.' + payload + '.' + signature;
          const url = 'https://api.appstoreconnect.apple.com/v1/profiles?filter[name]=' + encodeURIComponent('L Shell App Store') + '&limit=5';
          const res = await fetch(url, { headers: { Authorization: 'Bearer ' + jwt } });
          if (!res.ok) { console.error('ASC API error', res.status, await res.text()); process.exit(1); }
          const json = await res.json();
          if (!json.data || json.data.length === 0) { console.error('Profile not found'); process.exit(1); }
          writeFileSync('/tmp/profile.mobileprovision', Buffer.from(json.data[0].attributes.profileContent, 'base64'));
          console.log('Fetched profile:', json.data[0].attributes.name, json.data[0].attributes.uuid);
          EOF
          node /tmp/fetch-profile.mjs

      - name: Install signing assets
        env:
          CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci /tmp/ci.keychain
          security default-keychain -s /tmp/ci.keychain
          security unlock-keychain -p ci /tmp/ci.keychain
          security import /tmp/cert.p12 -k /tmp/ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci /tmp/ci.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Decoded profile (expected: 12250 bytes, sha256 44299f7dd387a0a21d049a7a78322434fde07a81451a5a379538467d9b798f43)"
          wc -c /tmp/profile.mobileprovision
          shasum -a 256 /tmp/profile.mobileprovision
          python3 - <<'PYEOF' > /tmp/profile-vars.sh
          import plistlib
          data = open('/tmp/profile.mobileprovision','rb').read()
          start = data.find(b'<?xml')
          end = data.find(b'</plist>') + len(b'</plist>')
          assert start >= 0 and end > start, 'plist not found in profile'
          p = plistlib.loads(data[start:end])
          print(f"PROFILE_UUID={p['UUID']}")
          print(f"PROFILE_NAME=\"{p['Name']}\"")
          print(f"IML={p['Entitlements']['com.apple.developer.kernel.increased-memory-limit']}")
          PYEOF
          cat /tmp/profile-vars.sh
          source /tmp/profile-vars.sh
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), increased-memory-limit=$IML"
          test "$PROFILE_NAME" = "L Shell App Store"
          test "$IML" = "True"
          security find-identity -v -p codesigning || true
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/ClaudeTerminal.xcodeproj \
            -scheme ClaudeTerminal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/LShell.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=${{ vars.BUNDLE_ID }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
                        <key>signingCertificate</key><string>iPhone Distribution: Yutaro Koseki (3S4RCG5ZVF)</string>
            <key>stripSwiftSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ vars.BUNDLE_ID }}</key><string>L Shell App Store</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath /tmp/LShell.xcarchive \
            -exportPath /tmp/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          set -o pipefail
          xcrun altool --upload-app \
            --file /tmp/export/*.ipa \
            --type ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" 2>&1 | tee /tmp/upload.log
          # altool can exit 0 even when the upload was rejected; treat its
          # own failure markers as a failed step.
          if grep -q "UPLOAD FAILED\|Failed to upload package" /tmp/upload.log; then
            echo "altool reported an upload failure" >&2
            exit 1
          fi

      - name: Verify build arrived on App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cat > /tmp/verify-build.mjs <<'EOF'
          import { createSign } from 'node:crypto';
          const b64url = (s) => Buffer.from(s).toString('base64url');
          function makeJwt() {
            const header = b64url(JSON.stringify({ alg: 'ES256', kid: process.env.ASC_API_KEY_ID, typ: 'JWT' }));
            const now = Math.floor(Date.now() / 1000);
            const payload = b64url(JSON.stringify({ iss: process.env.ASC_API_ISSUER_ID, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }));
            const signer = createSign('SHA256');
            signer.update(header + '.' + payload);
            signer.end();
            const signature = signer.sign({ key: process.env.ASC_API_KEY_P8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
            return header + '.' + payload + '.' + signature;
          }
          const url = 'https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6834720529&sort=-uploadedDate&limit=1';
          for (let i = 0; i < 10; i++) {
            const res = await fetch(url, { headers: { Authorization: 'Bearer ' + makeJwt() } });
            const json = await res.json();
            if (json.data && json.data.length > 0) {
              console.log('Build found on App Store Connect:', json.data[0].attributes.version, json.data[0].attributes.processingState);
              process.exit(0);
            }
            console.log('Build not visible yet, waiting 30s (attempt ' + (i + 1) + '/10)');
            await new Promise((r) => setTimeout(r, 30000));
          }
          console.error('Build did not appear on App Store Connect');
          process.exit(1);
          EOF
          node /tmp/verify-build.mjs
